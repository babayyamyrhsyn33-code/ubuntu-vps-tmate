name: Ubuntu VPS (Advanced)

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: System Preparation
        run: |
          echo "========================================"
          echo "  Advanced Ubuntu VPS - Starting up"
          echo "========================================"
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl wget htop neofetch tmux git nano vim > /dev/null
          echo "System tools installed"

      - name: Start tmate Session
        uses: mxschmitt/action-tmate@v3
        with:
          sudo: true
          detached: true
